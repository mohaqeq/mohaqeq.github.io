baseURL = "https://mohaqeq.github.io/"
locale = "en-US"
title = "Hamidreza Mohaqeq"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = false
pagination.pagerSize = 12

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Hamidreza Mohaqeq writes about software architecture, developer tools, AI coding agents, web UI, graphics and teaching kids to code, with the code for every post."
  author = "Hamidreza Mohaqeq"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  hideFooter = false
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Notes from the workbench"
    Content = """I'm a software engineer who learns by building. This is where I write up what I built, why I built it, and what I
learned, including the experiments that didn't go the way I expected.

You'll find posts on **software architecture and developer tools**, **AI coding agents and local LLMs**, **web UI**,
**graphics**, and **teaching kids to code**. Each post links to the code, so you can run it yourself."""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/mohaqeq"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.label]
    text = "Hamidreza Mohaqeq"

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Archive"
  url = "/archives/"
  weight = 2
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
  style = "monokai"
