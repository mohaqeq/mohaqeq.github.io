baseURL = "https://mohaqeq.github.io/"
locale = "en-US"
title = "Hamidreza Mohaqeq"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = false
pagination.pagerSize = 12

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Personal blog of Hamidreza Mohaqeq: software, side projects, experiments and other things worth writing down."
  author = "Hamidreza Mohaqeq"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  hideFooter = false
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Notes from the workbench"
    Content = """I'm a software engineer. This is my personal blog: things I build, experiments I run, ideas I'm thinking
through, and anything else I find worth writing down.

Mostly software, but not only."""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/mohaqeq"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.label]
    text = "Hamidreza Mohaqeq"

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Archive"
  url = "/archives/"
  weight = 2
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
  style = "monokai"
